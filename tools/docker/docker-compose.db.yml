services:
  postgres:
    image: postgres:16-alpine
    container_name: holt-postgres
    environment:
      POSTGRES_DB: holt
      POSTGRES_USER: holt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-holt}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
